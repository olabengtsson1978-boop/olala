<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stash – Upptäck</title>
  <meta name="theme-color" content="#2b6cb0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon128.png">
  <link rel="stylesheet" href="styles.css">
  <style>body { max-width: 680px; margin: 0 auto; padding: 24px 16px 60px; }</style>
</head>
<body>
  <nav class="nav">
    <span class="brand">Stash</span>
    <a href="index.html" class="active">Upptäck</a>
    <a href="library.html">Bibliotek</a>
    <a href="review.html">Repetera (<span id="due-count">0</span>)</a>
  </nav>

  <h1>Lägg till manuellt</h1>
  <textarea id="new-text" rows="3" placeholder="Skriv eller klistra in något att spara…"></textarea>
  <div class="row">
    <input type="text" id="new-tags" placeholder="Taggar, kommaseparerat (valfritt)">
    <select id="new-stash"></select>
  </div>
  <button class="primary" id="save-btn">Spara kort</button>

  <h1 style="margin-top:32px;">Förslag</h1>
  <p class="muted" id="suggestions-status" style="padding:0;text-align:left;">Laddar förslag…</p>
  <div id="suggestions-list"></div>
  <button id="refresh-btn">Uppdatera förslag</button>

  <details style="margin-top:24px;">
    <summary style="cursor:pointer;color:#888;font-size:13px;">Flöden som förslagen hämtas från</summary>
    <div id="feed-list" style="margin-top:10px;"></div>
    <div class="row" style="margin-top:8px;">
      <input type="text" id="new-feed-url" placeholder="RSS/Atom-URL, t.ex. https://exempel.se/rss.xml">
      <input type="text" id="new-feed-name" placeholder="Namn (valfritt)" style="max-width:140px;">
      <button id="add-feed-btn">Lägg till</button>
    </div>
  </details>

  <script src="storage.js"></script>
  <script src="discover.js"></script>
  <script src="index.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    }
  </script>
</body>
</html>
