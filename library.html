<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stash – Bibliotek</title>
  <meta name="theme-color" content="#2b6cb0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon128.png">
  <link rel="stylesheet" href="styles.css">
  <style>body { max-width: 680px; margin: 0 auto; padding: 24px 16px; }</style>
</head>
<body>
  <nav class="nav">
    <span class="brand">Stash</span>
    <a href="index.html">Upptäck</a>
    <a href="library.html" class="active">Bibliotek</a>
    <a href="review.html">Repetera</a>
  </nav>

  <h1>Ditt bibliotek</h1>
  <div class="links">
    <a href="#" id="export-btn">Exportera säkerhetskopia</a>
    <a href="#" id="import-btn">Importera</a>
    <input type="file" id="import-file" accept="application/json" hidden>
  </div>

  <h2 style="font-size:13px;color:#888;margin:0 0 6px;">Stashes</h2>
  <div id="stash-filters" class="tags" style="margin-bottom:8px;"></div>
  <div class="row">
    <input type="text" id="new-stash-name" placeholder="Ny stash…">
    <button id="add-stash-btn">Skapa</button>
  </div>

  <div class="row">
    <input type="text" id="search" placeholder="Sök i kort och taggar…">
  </div>
  <h2 style="font-size:13px;color:#888;margin:0 0 6px;">Taggar</h2>
  <div id="tag-filters" class="tags" style="margin-bottom:14px;"></div>

  <div id="list"></div>

  <script src="storage.js"></script>
  <script src="library.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    }
  </script>
</body>
</html>
